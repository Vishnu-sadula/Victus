name: CI

on:
  push:
    branches:
      - main
      - master
    workflow-dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test, validate, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Backend/requirements.txt
          python -m pip install ruff pytest

      - name: Lint backend
        run: ruff check Backend

      - name: Check Python syntax
        run: python -m compileall -q Backend

      - name: Run backend tests
        shell: bash
        run: |
          if find Backend -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest Backend
          else
            echo "No Python tests found; skipping pytest"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend JavaScript syntax
        run: node --check Frontend/app.js

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Build backend Docker image
        run: docker build --file Backend/Dockerfile --tag ci-backend:${{ github.sha }} Backend

      - name: Build frontend Docker image
        run: docker build --file Frontend/Dockerfile --tag ci-frontend:${{ github.sha }} Frontend

